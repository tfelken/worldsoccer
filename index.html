<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office World Cup 2026 — Showdown HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --bg2:#000; --panel:#16161a; --panel2:#1f1f24;
  --line:#2b2b31; --line2:#3a3a42;
  --txt:#ffffff; --mut:#9a9aa3; --mut2:#62626b;
  --cyan:#13c1c8; --lime:#46d86a; --pink:#ff2d9b; --orange:#ff6a1f; --gold:#f5c542; --violet:#3b46d6;
  --rib:linear-gradient(90deg,#3b46d6,#13c1c8 18%,#46d86a 34%,#0a0a0b 46%,#0a0a0b 54%,#ff2d9b 70%,#ff6a1f);
  --grad:linear-gradient(100deg,#ff2d9b,#ff6a1f);
  --grad2:linear-gradient(100deg,#13c1c8,#3b46d6);
  --grad3:linear-gradient(100deg,#46d86a,#13c1c8);
  --r:14px; --r2:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:80px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;background:var(--rib);z-index:100}
h1,h2,h3,.disp{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.4px;text-transform:uppercase}
.mono{font-family:'DM Mono',monospace}
a{color:var(--cyan)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

header{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-top:5px}
.hbar{max-width:1200px;margin:0 auto;padding:15px 20px 12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:13px}
.logo .mark{width:46px;height:46px;border-radius:12px;background:#000;border:1px solid var(--line2);display:grid;place-items:center;font-size:24px}
.logo h1{font-size:25px;line-height:.9}
.logo .sub{font-size:10px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-family:'DM Sans';font-weight:700;margin-top:3px}
.whoami{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tabs{max-width:1200px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:13px 16px;font-size:13px;font-weight:700;color:var(--mut);background:none;border:none;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s;letter-spacing:.3px}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--txt);border-bottom-color:var(--pink)}

main{max-width:1200px;margin:0 auto;padding:28px 20px}
.pagehead{margin-bottom:24px}
.pagehead .kick{font-size:11px;letter-spacing:4px;color:var(--mut);font-weight:800;text-transform:uppercase}
.pagehead h2{font-size:clamp(38px,7vw,58px);line-height:.92;margin-top:6px;color:#fff;letter-spacing:0}
.pagehead p{color:var(--mut);max-width:780px;margin-top:12px;font-size:14.5px;line-height:1.6}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:3px;letter-spacing:.4px}
.card .ch-sub{color:var(--mut);font-size:13px;margin-bottom:14px;line-height:1.5}
.grid{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:840px){.g2,.g3{grid-template-columns:1fr}}

.btn{border:none;border-radius:9px;padding:12px 18px;font-weight:800;font-size:13px;color:#000;background:#fff;letter-spacing:.4px;text-transform:uppercase;transition:.12s}
.btn:hover{transform:translateY(-1px)}
.btn.alt{background:var(--grad);color:#fff}
.btn.gh{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.btn.gh:hover{border-color:#fff}
.btn.sm{padding:8px 13px;font-size:11.5px}
.btn.danger{background:transparent;border:1px solid rgba(255,80,110,.5);color:#ff7a92}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,select.inp{background:#000;border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:11px 13px;font-size:14px;width:100%}
.inp:focus{outline:none;border-color:var(--cyan)}
label.fld{display:block;font-size:11px;color:var(--mut);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

.flag{width:30px;height:20px;border-radius:3px;object-fit:cover;background:#222;box-shadow:0 1px 2px rgba(0,0,0,.6);flex:none;vertical-align:middle}
.flag.lg{width:38px;height:25px}
.tchip{display:inline-flex;align-items:center;gap:8px;background:#000;border:1px solid var(--line);border-radius:8px;padding:6px 12px 6px 7px;font-size:13px;font-weight:600}
.tchip.pick{cursor:pointer;transition:.12s;user-select:none}
.tchip.pick:hover{border-color:var(--line2)}
.tchip.sel{border-color:var(--lime);background:rgba(70,216,106,.12)}
.tchip.adv{border-color:var(--cyan)}
.tchip.out{opacity:.4;text-decoration:line-through}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.gcard .gh{padding:11px 14px;background:#000;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.gcard .gh .gl{font-family:'Anton';font-size:17px;letter-spacing:1px}
.gcard .gh .meta{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.gcard .teams{padding:8px}
.gcard .teamrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.gcard .teamrow:hover{background:#000}
.gcard .teamrow .nm{flex:1;font-size:13.5px;font-weight:600}
.gcard .teamrow .od{font-size:11px;color:var(--mut2);font-weight:600}
.gcard .teamrow.sel{background:rgba(70,216,106,.1)}
.gcard .teamrow.adv .nm{color:var(--cyan)}
.gcard .teamrow .tick{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;color:#000;flex:none}
.gcard .teamrow.sel .tick{background:var(--lime);border-color:var(--lime)}
.gcard .teamrow.adv .tick{background:var(--cyan);border-color:var(--cyan)}
.gcard .gfoot{padding:8px 12px;font-size:10px;color:var(--mut2);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:800}
tr:last-child td{border-bottom:none}
.rank{font-family:'Anton';font-size:19px;width:34px;color:var(--mut2)}
.rank.r1{color:var(--gold)}.rank.r2{color:#cfd2dd}.rank.r3{color:#d98b4a}
td .pts{font-family:'Anton';font-size:18px}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;padding:4px 9px;border-radius:6px;text-transform:uppercase}
.badge.live{background:rgba(70,216,106,.16);color:var(--lime)}
.badge.win{background:#fff;color:#000}
.badge.out{background:rgba(255,80,110,.16);color:#ff7a92}
.badge.mut{background:#000;color:var(--mut);border:1px solid var(--line)}

.seg{display:inline-flex;background:#000;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:none;color:var(--mut);padding:8px 14px;border-radius:7px;font-size:12px;font-weight:700}
.seg button.on{background:var(--panel2);color:#fff}

.note{background:#000;border:1px solid var(--line2);border-left:3px solid var(--cyan);border-radius:10px;padding:13px 16px;font-size:13px;color:#cfd6e6;line-height:1.55}
.note.warn{border-left-color:var(--gold);color:#f3e6c2}
.note b{color:#fff}
.empty{text-align:center;padding:46px 20px;color:var(--mut2)}
.empty .em-ic{font-size:42px;margin-bottom:12px;opacity:.5}

.slot{font-family:'Anton';font-size:clamp(34px,8vw,72px);line-height:1;color:#fff;min-height:80px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.slot img{width:auto;height:.78em;border-radius:5px}
.code{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#000;font-weight:800;font-size:11px;border-radius:6px;padding:4px 9px;letter-spacing:.5px;min-width:42px}

.bracket{display:flex;gap:26px;overflow-x:auto;padding:6px 4px 18px;scroll-behavior:smooth}
.bcol{display:flex;flex-direction:column;justify-content:space-around;min-width:236px;gap:12px}
.bcol .bch{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;font-weight:800;text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:9px;padding:10px 11px;transition:.12s;min-height:42px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow.click{cursor:pointer}
.mrow.click:hover{background:#000}
.mrow .nm{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.wins{background:rgba(70,216,106,.1)}
.mrow.wins .nm{color:var(--lime);font-weight:700}
.mrow.lose{opacity:.45}
.champbanner{background:var(--grad);border-radius:13px;padding:18px 22px;text-align:center;color:#fff;margin-top:14px}
.champbanner .lbl{font-size:10px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9}
.champbanner .nm{font-family:'Anton';font-size:28px;margin-top:2px}

.oddsboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ocard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.ocard .otop{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ocard .otop .nm{font-weight:700;font-size:14.5px;flex:1}
.ocard .otop .grp{font-size:10px;color:var(--mut2);background:#000;border:1px solid var(--line);padding:3px 8px;border-radius:6px;font-weight:700}
.omkt{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.omkt .m{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.omkt .m .l{font-size:9px;color:var(--mut2);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.omkt .m .v{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.omkt .m .v .pc{font-size:10px;color:var(--lime);font-weight:700}
.omkt .m input{width:70%;background:transparent;border:none;color:#fff;font-family:'DM Mono';font-size:13px;padding:0}
.omkt .m input:focus{outline:none;color:var(--cyan)}

.entry{display:flex;align-items:center;gap:13px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:9px}
.entry .av{width:40px;height:40px;border-radius:11px;background:#000;border:1px solid var(--line2);display:grid;place-items:center;font-family:'Anton';font-size:16px;color:#fff;flex:none}
.entry .nm{font-weight:700;font-size:15px}
.entry .st{font-size:12px;color:var(--mut)}
.entry .sp{margin-left:auto;display:flex;gap:7px;align-items:center}
.tag{font-size:10px;font-weight:800;padding:4px 9px;border-radius:6px;background:#000;border:1px solid var(--line);color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.tag.ok{color:var(--lime);border-color:rgba(70,216,106,.3)}
.tag.no{color:#ff7a92;border-color:rgba(255,80,110,.3)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .l{font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.kpi .v{font-family:'Anton';font-size:32px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--mut)}

.hr{height:1px;background:var(--line);margin:18px 0}
.right{margin-left:auto}.muted{color:var(--mut)}
.foot{text-align:center;color:var(--mut2);font-size:12px;padding:30px 0 10px}
details.acc{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
details.acc summary{padding:13px 15px;cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ch{margin-left:auto;color:var(--mut)}
details.acc[open] summary{border-bottom:1px solid var(--line)}
details.acc .body{padding:15px}

/* draw cards */
.drawgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;text-align:center;transition:.15s}
.pcard.unrev{cursor:pointer;border-style:dashed;border-color:var(--line2)}
.pcard.unrev:hover{border-color:var(--gold);background:#000}
.pcard.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pcard .who{font-family:'Anton';font-size:19px;letter-spacing:.5px}
.pcard .teamlist{display:flex;flex-direction:column;gap:6px;margin-top:11px}
.pcard .teamlist .tl{display:flex;align-items:center;gap:8px;background:#000;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;font-weight:600;text-align:left}
.pcard .teamlist .tl .od{margin-left:auto;font-size:10px;color:var(--mut2)}
.pcard .hint{color:var(--mut2);font-size:12px;margin-top:10px}
.spinflag{font-size:30px}

.battle{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.battle .bt{padding:9px 13px;background:#000;border-bottom:1px solid var(--line);font-family:'Anton';font-size:15px;letter-spacing:1px}
.battle .br{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px}
.battle .br+.br{border-top:1px solid var(--line)}
.battle .br .who{flex:1;font-weight:600}
.battle .br.gone{opacity:.4}
.battle .br .pos{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px}

.brkSel{background:#000;border:1px solid var(--line2);color:#fff;border-radius:7px;padding:6px 7px;font-size:12px;max-width:130px;flex:1}
.brkSel:focus{outline:none;border-color:var(--cyan)}
.mrow .own{font-size:11px;color:var(--cyan);margin-left:auto;font-weight:700;white-space:nowrap}
.mrow .go{cursor:pointer;color:var(--mut);padding:0 5px;font-size:13px}
.mrow .go:hover{color:var(--lime)}
.mlabel{line-height:1.35}

.dayhead{font-family:'Anton';font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;padding:8px 12px;background:#000;border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.mbody{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:13px 12px}
.mt{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.mt .mtn{font-size:13px;font-weight:700;line-height:1.15}
.mt.mtw .mtn{color:var(--lime)}
.mt.mtl{opacity:.45}
.msc{font-family:'Anton';font-size:19px;white-space:nowrap;color:#fff;text-align:center;min-width:46px}
.mfoot{padding:7px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mut2);text-align:center}
.owntag{display:inline-block;background:#000;border:1px solid var(--line2);color:var(--cyan);font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:5px;padding:2px 6px}
table.gt{font-size:12.5px}
table.gt th,table.gt td{padding:7px 8px}
tr.thru td{background:rgba(70,216,106,.07)}
tr.thru td:first-child{box-shadow:inset 2px 0 0 var(--lime)}
tr.third td{background:rgba(245,197,66,.05)}
tr.third td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
tr.outr td{opacity:.45}
.prog{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:3px;padding-left:37px}
tr.thru .prog{color:var(--lime)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#16161a;border:1px solid var(--line2);color:#fff;padding:13px 22px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:200;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:rgba(70,216,106,.5)}.toast.bad{border-color:rgba(255,80,110,.5)}
.modalwrap{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modalwrap.show{display:flex}
.modalbox{background:var(--panel);border:1px solid var(--line2);border-radius:15px;padding:22px;max-width:560px;width:100%;position:relative;margin:36px 0;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modalbox h3{font-size:21px;margin-bottom:6px}
.modalx{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--mut);font-size:20px;line-height:1}
.modalbox textarea{width:100%;background:#000;border:1px solid var(--line2);color:#fff;border-radius:9px;padding:10px;resize:vertical}

</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo">
      <div class="mark">⚽</div>
      <div><h1>Showdown HQ</h1><div class="sub">Office World Cup · 2026</div></div>
    </div>
    <div class="whoami">You are: <b id="meName">— set in My Picks</b></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="main"></main>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none" multiple>

<script>
/* ============================ DATA ============================ */
const GROUPS = {
  A:[["Mexico","mx"],["South Africa","za"],["South Korea","kr"],["Czechia","cz"]],
  B:[["Canada","ca"],["Bosnia & Herz.","ba"],["Qatar","qa"],["Switzerland","ch"]],
  C:[["Brazil","br"],["Morocco","ma"],["Haiti","ht"],["Scotland","gb-sct"]],
  D:[["United States","us"],["Paraguay","py"],["Australia","au"],["Türkiye","tr"]],
  E:[["Germany","de"],["Curaçao","cw"],["Ivory Coast","ci"],["Ecuador","ec"]],
  F:[["Netherlands","nl"],["Japan","jp"],["Sweden","se"],["Tunisia","tn"]],
  G:[["Belgium","be"],["Egypt","eg"],["Iran","ir"],["New Zealand","nz"]],
  H:[["Spain","es"],["Cape Verde","cv"],["Saudi Arabia","sa"],["Uruguay","uy"]],
  I:[["France","fr"],["Senegal","sn"],["Iraq","iq"],["Norway","no"]],
  J:[["Argentina","ar"],["Algeria","dz"],["Austria","at"],["Jordan","jo"]],
  K:[["Portugal","pt"],["DR Congo","cd"],["Uzbekistan","uz"],["Colombia","co"]],
  L:[["England","gb-eng"],["Croatia","hr"],["Ghana","gh"],["Panama","pa"]]
};
const GLETTERS = Object.keys(GROUPS);
// flat team -> code, and team -> group
const CODE = {}, TEAMGRP = {};
GLETTERS.forEach(g=>GROUPS[g].forEach(([n,c])=>{CODE[n]=c;TEAMGRP[n]=g;}));
const ALLTEAMS = Object.keys(CODE);

// Seed outright winner odds (American). Snapshot ~June 2-3 2026 (FanDuel/BetMGM) + tiered estimates. All editable.
const SEED_WIN = {
  "Spain":475,"France":500,"England":650,"Brazil":850,"Argentina":900,"Portugal":1000,
  "Germany":1400,"Netherlands":2200,"Belgium":3500,"Norway":3500,"Croatia":4000,"Uruguay":4000,
  "Colombia":5000,"Morocco":5500,"Switzerland":6000,"Japan":6600,"Senegal":6600,"Mexico":8000,
  "United States":8000,"Ecuador":11000,"Austria":13000,"Türkiye":15000,"Ivory Coast":17000,

function seedOdds(st){

    st.odds[t]={ win, fin:probToAm(clamp(wp*3.0,.005,.85)), t4:probToAm(clamp(wp*4.2,.008,.92)), t8:probToAm(clamp(wp*6.5,.012,.96)) }; });

function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function amToProb(a){ a=Number(a); if(!a) return 0; return a>0?100/(a+100):(-a)/((-a)+100); }
function probToAm(p){ p=clamp(p,.001,.999); return p>=.5?Math.round(-(p/(1-p))*100):Math.round((1-p)/p*100); }

/* ===================== TOURNAMENT ENGINE (feed-driven) =====================
   Group tables use the official tiebreakers we can compute: points, goal diff,
   goals scored, then head-to-head (points/GD/goals) among tied teams. The last
   official tiebreakers (fair play points, drawing of lots) aren't derivable
   from scores. Best 3rds: top 8 by points, GD, goals. Knockout structure &
   progression come straight from the feed's official numbering (M73-M104). */
function groupMatchesPlayed(g){ return (S.feed.matches||[]).filter(m=>m.group==="Group "+g&&mPlayed(m)); }
function groupTableFor(g){
  if(_gtCache&&_gtCache[g])return _gtCache[g];
  const rows={}; GROUPS[g].forEach(([t])=>rows[t]={t,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
  groupMatchesPlayed(g).forEach(m=>{
    const a=feedTeam(m.team1),b=feedTeam(m.team2); if(!rows[a]||!rows[b])return;
    const [ga,gb]=m.score.ft;
    rows[a].P++;rows[b].P++; rows[a].GF+=ga;rows[a].GA+=gb; rows[b].GF+=gb;rows[b].GA+=ga;
    if(ga>gb){rows[a].W++;rows[b].L++;rows[a].Pts+=3;}
    else if(gb>ga){rows[b].W++;rows[a].L++;rows[b].Pts+=3;}
    else {rows[a].D++;rows[b].D++;rows[a].Pts++;rows[b].Pts++;}
  });
  let arr=Object.values(rows);
  const base=(x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF;
  arr.sort(base);
  for(let i=0;i<arr.length;){
    let j=i+1; while(j<arr.length&&base(arr[i],arr[j])===0)j++;
    if(j-i>1){
      const tied=arr.slice(i,j).map(r=>r.t); const mini={};
      tied.forEach(t=>mini[t]={Pts:0,GD:0,GF:0});
      groupMatchesPlayed(g).forEach(m=>{
        const a=feedTeam(m.team1),b=feedTeam(m.team2);
        if(!tied.includes(a)||!tied.includes(b))return;
        const [ga,gb]=m.score.ft;
        mini[a].GD+=ga-gb;mini[b].GD+=gb-ga;mini[a].GF+=ga;mini[b].GF+=gb;
        if(ga>gb)mini[a].Pts+=3; else if(gb>ga)mini[b].Pts+=3; else {mini[a].Pts++;mini[b].Pts++;}
      });
      const sub=arr.slice(i,j).sort((x,y)=>mini[y.t].Pts-mini[x.t].Pts||mini[y.t].GD-mini[x.t].GD||mini[y.t].GF-mini[x.t].GF||x.t.localeCompare(y.t));
      sub.forEach((r,k)=>arr[i+k]=r);
    }
    i=j;
  }
  const done=arr.reduce((s,r)=>s+r.P,0)===12;
  const res={rows:arr,done};
  _gtCache=_gtCache||{}; _gtCache[g]=res;
  return res;
}
function allGroupsDone(){ return GLETTERS.every(g=>groupTableFor(g).done); }
function bestThirds(){
  const t=GLETTERS.map(g=>{const gt=groupTableFor(g); return gt.done?Object.assign({g},gt.rows[2]):null;}).filter(Boolean);
  t.sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF||x.t.localeCompare(y.t));
  return t;
}
const KO_ROUNDS=[["Round of 32","r32"],["Round of 16","r16"],["Quarter-final","qf"],["Semi-final","sf"],["Final","final"]];
function koKey(m){ return m.num!=null?String(m.num):(m.round==="Final"?"final":normTeam(m.round||"")); }
function koMatches(){
  const out={r32:[],r16:[],qf:[],sf:[],final:[],third:[]};
  (S.feed.matches||[]).forEach(m=>{
    if(m.group)return;
    const r=KO_ROUNDS.find(([name])=>m.round===name);
    if(r) out[r[1]].push(m);
    else if(/third/i.test(m.round||"")) out.third.push(m);
  });
  ['r32','r16','qf','sf'].forEach(k=>out[k].sort((a,b)=>(a.num||0)-(b.num||0)));
  return out;
}
let _koCache=null,_byNumCache=null,_gtCache=null;
function bustKO(){ _koCache=null; _byNumCache=null; _gtCache=null; }
function koByNum(){ if(_byNumCache)return _byNumCache; const map={}; (S.feed.matches||[]).forEach(m=>{ if(m.num!=null)map[m.num]=m; if(m.round==="Final")map.final=m; }); _byNumCache=map; return map; }
function resolveSide(m,side,_d){
  _d=_d||0; if(_d>14) return {team:null,label:"?"};
  const raw=side===1?m.team1:m.team2;
  const t=feedTeam(raw); if(t) return {team:t,label:t};
  const manual=S.ko.sides[koKey(m)+"_"+side]; if(manual) return {team:manual,label:manual};
  const code=String(raw||"").trim();
  let mm;
  if((mm=code.match(/^([12])([A-L])$/))){
    const gt=groupTableFor(mm[2]);
    if(gt.done){const tm=gt.rows[mm[1]==='1'?0:1].t; return {team:tm,label:tm};}
    return {team:null,label:(mm[1]==='1'?'Winner ':'2nd ')+mm[2]};
  }
  if((mm=code.match(/^([WL])(\d+)$/))){
    const prev=koByNum()[parseInt(mm[2])];
    if(prev){ const w=koWinnerTeam(prev,_d+1);
      if(w){ if(mm[1]==='W') return {team:w,label:w};
        const a=resolveSide(prev,1,_d+1).team,b=resolveSide(prev,2,_d+1).team;
        const l=(a&&b)?(w===a?b:a):null; return {team:l,label:l||('Loser M'+mm[2])}; }
    }
    return {team:null,label:(mm[1]==='W'?'Winner':'Loser')+' M'+mm[2]};
  }
  if(/^3/.test(code)) return {team:null,label:"3rd: "+code.slice(1).replace(/^[\/ ]/,'')};
  return {team:null,label:code||"—"};
}
function koWinnerTeam(m,_d){
  const manual=S.ko.manual[koKey(m)]; if(manual) return manual;
  const w=mWinner(m); if(!w) return null;
  return resolveSide(m,w,(_d||0)+1).team;
}
function KO(){
  if(_koCache)return _koCache;
  const k=koMatches();
  const wins=r=>k[r].map(m=>koWinnerTeam(m)).filter(Boolean);
  const r32=wins('r32'), r16=wins('r16'), qf=wins('qf'), sf=wins('sf');
  const fin=k.final[0]; let champ="",runnerup="";
  if(fin){ champ=koWinnerTeam(fin)||"";
    if(champ){ const a=resolveSide(fin,1).team,b=resolveSide(fin,2).team; runnerup=(a&&b)?(champ===a?b:a):""; } }
  _koCache={r32,r16,qf,sf,champ,runnerup};
  return _koCache;
}
function madeKnockouts(team){ return GLETTERS.some(g=>(S.results.group[g]||[]).includes(team)); }
function teamPoints(team){
  const k=KO();
  if(k.champ===team) return 25;
  if(k.sf.includes(team)) return 16;
  if(k.qf.includes(team)) return 10;
  if(k.r16.includes(team)) return 6;
  if(k.r32.includes(team)) return 3;
  if(madeKnockouts(team)) return 1;
  return 0;
}
function teamReached(team){
  const k=KO();
  if(k.champ===team) return "CHAMPION 🏆";
  if(k.runnerup===team) return "Runner-up";
  if(k.sf.includes(team)) return "Final";
  if(k.qf.includes(team)) return "Semifinal";
  if(k.r16.includes(team)) return "Quarterfinal";
  if(k.r32.includes(team)) return "Round of 32";
  if(madeKnockouts(team)) return "Knockouts";
  const gt=S.feed.matches.length?groupTableFor(TEAMGRP[team]):{done:false};
  if(gt.done){ const pos=gt.rows.findIndex(r=>r.t===team)+1;
    if(pos===3&&!allGroupsDone()) return "3rd — best-3rds pending";
    if(pos===3) return bestThirds().slice(0,8).some(x=>x.t===team)?"Through (3rd)":"Out (groups)";
    return pos<=2?"Through":"Out (groups)";
  }
  const adv=S.results.group[TEAMGRP[team]]||[];
  if(adv.length) return adv.includes(team)?"Through":"Out (groups)";
  return "—";
}
function koEliminated(team){
  const k=koMatches();
  const check=(m)=>{ const w=koWinnerTeam(m); if(!w)return false;
    const a=resolveSide(m,1).team,b=resolveSide(m,2).team;
    return (a===team||b===team)&&w!==team; };
  for(const r of ['r32','r16','qf','sf']) for(const m of k[r]) if(check(m)) return true;
  if(k.final[0]&&check(k.final[0])) return true;
  return false;
}
function teamAlive(team){
  if(!team) return false;
  if(koEliminated(team)) return false;
  if(S.feed.matches.length){
    const gt=groupTableFor(TEAMGRP[team]);
    if(gt.done){
      const pos=gt.rows.findIndex(r=>r.t===team)+1;
      if(pos>=4) return false;
      if(pos===3){
        if(!allGroupsDone()) return true;
        return bestThirds().slice(0,8).some(x=>x.t===team);
      }
      return true;
    }
    return true;
  }
  const adv=S.results.group[TEAMGRP[team]]||[];
  if(adv.length) return adv.includes(team);
  return true;
}
function playerScore(p){ return playerTeams(p).reduce((s,t)=>s+teamPoints(t),0); }
function isEliminated(p){ const ts=playerTeams(p); return ts.length>0 && ts.every(t=>!teamAlive(t)); }
function strength(t){ const o=S.odds[t]||{}; return amToProb(o.win)+amToProb(o.fin)+amToProb(o.t4)+amToProb(o.t8); }
function playerStrength(p){ return playerTeams(p).reduce((s,t)=>s+strength(t),0); }
function potTotal(){ return S.roster.reduce((s,p)=>s+(p.buyIns||[]).length,0)*2; }

/* ===================== DRAW ENGINE (per-person reveal) ===================== */
function clearRoll(){ S.roster.forEach(p=>{p.teams=[];p.buyIns=[];}); S.bucket=[]; }
function computeAssign(mode){
  const N=S.roster.length; const assign={}; S.roster.forEach(p=>assign[p.name]=[]); let bucket=[];
  if(mode==="random"){
    const t=shuffle(ALLTEAMS); let i=0;
    for(let r=0;r<4;r++) for(let p=0;p<N;p++) assign[S.roster[p].name].push(t[i++]);
    bucket=t.slice(i);
  } else if(mode==="fair"){
    const sorted=ALLTEAMS.slice().sort((a,b)=>strength(b)-strength(a));
    const load=S.roster.map(()=>0); let placed=0;
    for(const tm of sorted){ if(placed>=N*4) break; let best=-1;
      for(let p=0;p<N;p++){ if(assign[S.roster[p].name].length<4 && (best<0||load[p]<load[best])) best=p; }
      assign[S.roster[best].name].push(tm); load[best]+=strength(tm); placed++; }
    const used=new Set(Object.values(assign).flat()); bucket=sorted.filter(t=>!used.has(t));
  } else { // group: one team per group per person → each group is a 4-way battle
    const gOrder=shuffle(GLETTERS.slice());
    const pools={}; GLETTERS.forEach(g=>pools[g]=shuffle(GROUPS[g].map(x=>x[0])));
    const used=new Set();
    for(let r=0;r<4;r++) for(let p=0;p<N;p++){ const g=gOrder[(p+r)%12]; const tm=pools[g].find(x=>!used.has(x)); if(tm){used.add(tm); assign[S.roster[p].name].push(tm);} }
    bucket=ALLTEAMS.filter(t=>!used.has(t));
  }
  return {assign,bucket};
}
const ROLLMODES={
  group:{label:"One per group",desc:"Each person's 4 teams each come from a different group — so every group becomes a 3–4 person battle. Recommended."},
  fair:{label:"Balanced by odds",desc:"Hands out teams to even out everyone's combined odds as much as possible."},
  random:{label:"Completely random",desc:"Pure luck — 48 teams shuffled, 4 dealt to each person."}
};
function setMode(m){ S.rollMode=m; save(); render(); }
function startDraw(mode){
  if(S.roster.length<1){toast("Add players first","bad");return;}
  if(S.roster.length*4>48){toast("Max 12 players (4 each ≤ 48)","bad");return;}
  if(S.draw && S.draw.started && S.draw.revealed.length && !confirm("Restart the draw? Everyone's current teams are cleared.")) return;
  clearRoll();
  const {assign,bucket}=computeAssign(mode);
  S.draw={mode,started:true,assign,revealed:[]}; S.bucket=bucket; S.rollMode=mode; S.rolled=false;
  save(); render(); toast("Draw ready — tap each person to reveal");
}

function koCard(m){

const FEED_URL="https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json";
const FEED_ALIAS={uefapathawinner:'Bosnia & Herz.',uefapathbwinner:'Sweden',uefapathcwinner:'Türkiye',uefapathdwinner:'Czechia',icpath1winner:'DR Congo',icpath2winner:'Iraq'};
function feedTeam(raw){ const m=matchTeam(raw); if(m)return m; const a=FEED_ALIAS[normTeam(raw)]; return a||null; }
function mDate(m){ // -> epoch ms (parse "2026-06-11" + "13:00 UTC-6")
  try{ let off="+00:00"; let hm="12:00";
    if(m.time){ const t=String(m.time).match(/(\d{1,2}:\d{2})/); if(t)hm=t[1].padStart(5,'0');
      const o=String(m.time).match(/UTC([+-]\d{1,2})(?::?(\d{2}))?/); if(o){const h=parseInt(o[1]);off=(h<0?'-':'+')+String(Math.abs(h)).padStart(2,'0')+':'+(o[2]||'00');} }
    return new Date(`${m.date}T${hm}:00${off}`).getTime();
  }catch(e){ return new Date(m.date||0).getTime()||0; }
}
function mPlayed(m){ return !!(m.score&&Array.isArray(m.score.ft)); }
function mScoreStr(m){ if(!mPlayed(m))return ""; const s=m.score; let out=s.ft[0]+"–"+s.ft[1];
  if(s.p) out+=` (${s.p[0]}–${s.p[1]} pens)`; else if(s.et) out+=" (aet)"; return out; }
function mWinner(m){ if(!mPlayed(m))return null; const s=m.score; const r=s.p||s.et||s.ft;
  if(r[0]>r[1])return 1; if(r[1]>r[0])return 2; return 0; }
let _fetching=false;
function refreshFeed(){
  if(_fetching)return; _fetching=true; render();
  fetch(FEED_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok)throw new Error("HTTP "+r.status); return r.json(); })
    .then(d=>{ S.feed={fetchedAt:Date.now(),matches:(d.matches||[])}; _fetching=false; if(S.autoSync)syncFromFeed(); save(); render(); toast("Schedule updated ✓","good"); })
    .catch(e=>{ _fetching=false; render(); toast("Couldn't fetch — check connection and retry","bad"); });
}
let matchSeg="today";

function ownersStr(t){ const o=t?ownerOf(t):null; return o?`<span class="owntag">${o}</span>`:''; }

function matchCard(m){

    <div class="mfoot">${m.ground||''}${w===0&&played?' · draw':''}</div>
  </div>`;
}
function groupTables(){
  const cards=GLETTERS.map(g=>{
    const gt=groupTableFor(g); const arr=gt.rows, done=gt.done;
    const allDone=allGroupsDone();
    const b8=allDone?bestThirds().slice(0,8).map(x=>x.t):[];
    return `<div class="gcard">
      <div class="gh"><span class="gl">Group ${g}</span><span class="meta">${done?'complete ✓':arr.reduce((s,r)=>s+r.P,0)/2+'/6 played'}</span></div>
      <table class="gt"><thead><tr><th></th><th style="width:100%">Team</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>
      ${arr.map((r,i)=>{
        let cls="", prog="";
        if(i<2){cls="thru"; if(done)prog=i===0?"→ R32 as 1"+g:"→ R32 as 2"+g;}
        else if(i===2){ if(done&&allDone){ const inB8=b8.includes(r.t); cls=inB8?"thru":"outr"; prog=inB8?"→ R32 (best 3rd)":"eliminated"; }
          else { cls="third"; prog=done?"best-3rds pending":""; } }
        else if(done){cls="outr";prog="eliminated";}
        return `<tr class="${cls}">

function thirdsRace(){

/* ---- auto-sync feed -> contest results ---- */
function syncFromFeed(){
  let changed=[];
  GLETTERS.forEach(g=>{
    const gt=groupTableFor(g);
    if(!gt.done) return;
    const adv=[gt.rows[0].t,gt.rows[1].t];
    if(allGroupsDone()){
      const b8=bestThirds().slice(0,8).map(x=>x.t);
      if(b8.includes(gt.rows[2].t)) adv.push(gt.rows[2].t);
    }
    const cur=S.results.group[g]||[];
    if(JSON.stringify(cur)!==JSON.stringify(adv)){ S.results.group[g]=adv; changed.push(g); }
  });
  if(changed.length){ save(); toast("Synced groups: "+changed.join(", "),"good"); }
  return changed.length;
}
function viewMatches(){
  const F=S.feed; const has=F.matches&&F.matches.length;
  const fetchedStr=F.fetchedAt?new Date(F.fetchedAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):"never";
  const head=`<div class="pagehead"><div class="kick">Schedule &amp; Scores</div><h2>Matches</h2>
    <p>Who's playing, who owns them, and how the groups stand. Hit refresh in the morning and through the day — the data source updates about once daily (not live minute-by-minute).</p></div>
  <div class="card"><div class="row">
    <button class="btn" onclick="refreshFeed()" ${_fetching?'disabled':''}>${_fetching?'Fetching…':'↻ Refresh scores & schedule'}</button>
    <span class="muted" style="font-size:12.5px">Last updated: <b>${fetchedStr}</b></span>
    <span class="right seg">
      <button class="${matchSeg==='today'?'on':''}" onclick="setMatchSeg('today')">Today</button>
      <button class="${matchSeg==='upcoming'?'on':''}" onclick="setMatchSeg('upcoming')">Upcoming</button>
      <button class="${matchSeg==='results'?'on':''}" onclick="setMatchSeg('results')">Results</button>
      <button class="${matchSeg==='tables'?'on':''}" onclick="setMatchSeg('tables')">Group tables</button>
    </span></div></div>`;
  if(!has) return head+`<div class="empty"><div class="em-ic">📡</div>No schedule loaded yet — hit <b>Refresh</b> above.<br><span style="font-size:12px">Source: openfootball/worldcup.json (free, public domain).</span></div>`;
  const sorted=F.matches.slice().sort((a,b)=>mDate(a)-mDate(b));
  let body="";
  if(matchSeg==='tables'){ body=`<div class="groups">${groupTables()}</div>`; }
  else{
    const todayStr=new Date().toDateString();
    let list;
    if(matchSeg==='today') list=sorted.filter(m=>new Date(mDate(m)).toDateString()===todayStr);
    else if(matchSeg==='upcoming') list=sorted.filter(m=>!mPlayed(m)&&mDate(m)>=Date.now()-3*3600e3).slice(0,40);
    else list=sorted.filter(mPlayed).reverse();
    if(!list.length) body=`<div class="empty"><div class="em-ic">${matchSeg==='today'?'😴':'📭'}</div>${matchSeg==='today'?'No matches today.':matchSeg==='results'?'No finished matches in the feed yet — refresh after games wrap up.':'Nothing upcoming found.'}</div>`;
    else{
      // group by date
      const byDay={};
      list.forEach(m=>{ const d=new Date(mDate(m)).toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'}); (byDay[d]=byDay[d]||[]).push(m); });
      body=Object.entries(byDay).map(([d,ms])=>`<div class="dayhead">${d}</div><div class="mgrid">${ms.map(matchCard).join("")}</div>`).join("");
    }
  }
  return head+body+`<div class="foot">Data: openfootball/worldcup.json · public domain · maintainer updates ~daily, so evening scores often land next morning. Contest scoring still comes from what you tick in Results &amp; Admin / Bracket.</div>`;
}

      return `<div class="gcard"><div class="gh"><span class="gl">Group ${g}</span><span class="meta">${adv.length} through</span></div>
        <div class="teams">${GROUPS[g].map(([t])=>{const on=adv.includes(t);return `<div class="teamrow ${on?'adv':''}" onclick="toggleAdv('${g}','${esc(t)}')"><span class="tick">${on?'✓':''}</span>${flag(t)}<span class="nm">${t}</span><span class="od">${ownerOf(t)||''}</span></div>`;}).join("")}</div>
        <div class="gfoot"><span>tick advancers</span><span class="muted">2 + lucky 3rd</span></div></div>`;}).join("")}</div>
  </div>
  <div class="card"><h3>Teams (CSV) — fix or bulk-edit assignments</h3>
    <div class="ch-sub">Re-rolled and lost the version you shared? Export the CSV, set the right teams per person in any spreadsheet, then import it back. The bucket recalculates automatically.</div>
    <div class="row">
      <button class="btn" onclick="exportCSV()">⬇ Export teams (CSV)</button>
      <button class="btn alt" onclick="importCSVPrompt()">⬆ Import teams (CSV)</button>
    </div>
  </div>
  <div class="card"><h3>Full backup</h3>
    <div class="row">
      <button class="btn gh sm" onclick="exportAll()">⬇ Export backup (JSON)</button>
      <button class="btn gh sm" onclick="document.getElementById('fileIn').click()">⬆ Import backup</button>
      <button class="btn danger sm right" onclick="wipe()">Reset all data</button>
    </div>
    <div class="ch-sub" style="margin-top:8px">JSON backup saves everything (teams, results, bracket, odds). Saves automatically to this browser; export before clearing browser data.</div>
  </div>`;
}
/* ---- CSV teams export/import ---- */
const TEAMNORM={}; ALLTEAMS.forEach(t=>TEAMNORM[normTeam(t)]=t);
function normTeam(s){ return String(s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function matchTeam(s){ const n=normTeam(s); if(TEAMNORM[n])return TEAMNORM[n];
  const al={southkorea:'South Korea',korea:'South Korea',korearepublic:'South Korea',usa:'United States',unitedstates:'United States',us:'United States',america:'United States',drc:'DR Congo',congo:'DR Congo',drcongo:'DR Congo',democraticrepublicofcongo:'DR Congo',turkiye:'Türkiye',turkey:'Türkiye',bosnia:'Bosnia & Herz.',bosniaherzegovina:'Bosnia & Herz.',bosniaandherzegovina:'Bosnia & Herz.',capeverde:'Cape Verde',caboverde:'Cape Verde',ivorycoast:'Ivory Coast',cotedivoire:'Ivory Coast',czechrepublic:'Czechia',czech:'Czechia',southafrica:'South Africa',newzealand:'New Zealand',saudiarabia:'Saudi Arabia',saudi:'Saudi Arabia',curacao:'Curaçao',brasil:'Brazil',holland:'Netherlands',thenetherlands:'Netherlands'};
  return al[n]||null;
}
function csvCell(s){ s=String(s==null?"":s); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function teamsCSV(){
  const rows=[["Player","Team 1","Team 2","Team 3","Team 4","Buy-ins"]];
  S.roster.forEach(p=>{const t=p.teams||[]; rows.push([p.name,t[0]||"",t[1]||"",t[2]||"",t[3]||"",(p.buyIns||[]).join("; ")]);});
  return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
}
function parseCSV(text){ const rows=[];let cur="",row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cur);cur="";} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";} else if(c==='\r'){} else cur+=c; } }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
let __EXPC=null;
function tryDownloadText(text,name,mime){ try{const b=new Blob([text],{type:mime||'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return true;}catch(e){return false;} }
function exportCSV(){ const csv=teamsCSV(); __EXPC={csv,filename:"WorldCup_Teams.csv"};
  openModal(`<h3>Teams (CSV)</h3><div class="ch-sub">Edit the team names per person, then re-import. Names just need to be close — minor spelling/accents are matched automatically.</div>
    <div class="row" style="margin:12px 0"><button class="btn" onclick="(tryDownloadText(__EXPC.csv,__EXPC.filename,'text/csv')?toast('Download started','good'):toast('Blocked — copy instead','bad'))">⬇ Download CSV</button>
      <button class="btn alt" onclick="copyText(__EXPC.csv,'CSV copied')">📋 Copy</button></div>
    <textarea class="inp" style="height:160px;font-family:'DM Mono';font-size:11px" readonly onclick="this.select()">${csv.replace(/</g,'&lt;')}</textarea>`); }
function importCSVPrompt(){
  openModal(`<h3>Import teams (CSV)</h3><div class="ch-sub">Upload your edited file or paste it. Columns: <b>Player, Team 1–4</b> (a Buy-ins column is optional). Re-importing replaces all current team assignments.</div>
    <div class="row" style="margin:10px 0"><button class="btn gh sm" onclick="pickCSVFile()">⬆ Choose CSV file</button><span class="muted" style="font-size:12px">or paste below</span></div>
    <textarea id="csvBox" class="inp" style="height:150px;font-family:'DM Mono';font-size:11px" placeholder="Player,Team 1,Team 2,Team 3,Team 4&#10;Ryan,Spain,Brazil,Mexico,Japan"></textarea>
    <div class="row" style="margin-top:11px"><button class="btn" onclick="doCSVImport(document.getElementById('csvBox').value)">Import teams</button></div>`); }
function pickCSVFile(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv,text/plain';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ const box=document.getElementById('csvBox'); if(box){box.value=rd.result;toast("File loaded — review, then Import");} else doCSVImport(rd.result); }; rd.readAsText(f); };
  inp.click(); }
function doCSVImport(text){
  if(!text||!text.trim()){toast("Nothing to import","bad");return;}
  const rows=parseCSV(text); if(!rows.length){toast("Couldn't read that CSV","bad");return;}
  let start=0; const first=rows[0].map(x=>normTeam(x));
  if(first.some(x=>x==='player'||x.indexOf('team')===0||x==='buyins'||x==='name')) start=1;
  const used=new Set(), newRoster=[], problems=[];
  for(let r=start;r<rows.length;r++){
    const cols=rows[r]; const name=String(cols[0]||"").trim(); if(!name)continue;
    const teams=[],buy=[];
    for(let c=1;c<cols.length;c++){
      String(cols[c]||"").split(/[;|]/).map(s=>s.trim()).filter(Boolean).forEach(part=>{
        const m=matchTeam(part);
        if(!m){problems.push(`${name}: “${part}” not recognized`);return;}
        if(used.has(m)){problems.push(`${name}: ${m} already taken`);return;}
        (teams.length<4?teams:buy).push(m); used.add(m);
      });
    }
    newRoster.push({name,teams,buyIns:buy});
  }
  if(!newRoster.length){toast("No players found in the CSV","bad");return;}
  S.roster=newRoster; S.bucket=ALLTEAMS.filter(t=>!used.has(t)); S.rolled=true;
  S.draw={mode:S.rollMode,started:true,assign:{},revealed:newRoster.map(p=>p.name)};
  newRoster.forEach(p=>S.draw.assign[p.name]=p.teams.slice());
  save(); closeModal(); render();
  if(problems.length){ openModal(`<h3>Imported — ${problems.length} to check</h3><div class="ch-sub">These cells didn't match a team and were skipped. Fix them in your CSV and re-import, or set them by hand.</div><div class="note warn" style="margin-top:8px">${problems.map(p=>p.replace(/</g,'&lt;')).join("<br>")}</div>`); }
  else toast("Teams imported ✓","good");
}
function toggleAdv(g,t){ let arr=S.results.group[g]||[]; if(arr.includes(t))arr=arr.filter(x=>x!==t); else{ if(arr.length>=3){toast("Max 3 advance","bad");return;} arr=[...arr,t]; } S.results.group[g]=arr; save(); render(); }

/* ===================== MODAL + BACKUP IO ===================== */
function openModal(html){ let m=document.getElementById('modal'); if(!m){m=document.createElement('div');m.id='modal';m.className='modalwrap';m.addEventListener('click',e=>{if(e.target===m)closeModal();});document.body.appendChild(m);} m.innerHTML=`<div class="modalbox"><button class="modalx" onclick="closeModal()">✕</button>${html}</div>`; m.classList.add('show'); }
function closeModal(){ const m=document.getElementById('modal'); if(m)m.classList.remove('show'); }
function jsonStr(o){ return JSON.stringify(o,null,2); }
function tryDownload(obj,name){ try{ const b=new Blob([jsonStr(obj)],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u;a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); return true; }catch(e){ return false; } }
function copyText(str,ok){ const done=()=>toast(ok||"Copied","good"); if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str,done));}else fallbackCopy(str,done); }
function fallbackCopy(str,done){ const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');done&&done();}catch(e){toast("Select & copy manually","bad");}ta.remove(); }
let __exp=null;
function exportAll(){ __exp={type:"wc_backup",...S}; const text=jsonStr(__exp).replace(/</g,'&lt;');
  openModal(`<h3>Organizer backup</h3><div class="ch-sub">Download it, or copy the text if download is blocked in this viewer.</div>
    <div class="row" style="margin:12px 0"><button class="btn" onclick="(tryDownload(__exp,'WorldCup_Backup.json')?toast('Download started','good'):toast('Blocked — copy instead','bad'))">⬇ Download</button>
    <button class="btn alt" onclick="copyText(jsonStr(__exp),'Backup copied')">📋 Copy text</button></div>
    <textarea class="inp" style="height:150px;font-family:'DM Mono';font-size:11px" readonly onclick="this.select()">${text}</textarea>`); }
document.getElementById('fileIn').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d.type==="wc_backup"){ delete d.type; S=Object.assign(blankState(),d); seedOdds(S); save(); render(); toast("Backup imported","good"); } else toast("Not a backup file","bad"); }catch(err){ toast("Couldn't read file","bad"); } };
  rd.readAsText(f); e.target.value=""; });
function wipe(){ if(confirm("Erase ALL data on this device? Export a backup first if unsure.")){ localStorage.removeItem(SK); S=seedOdds(blankState()); save(); render(); toast("Wiped clean"); } }

/* ===================== BOOT ===================== */
renderTabs(); render();
</script>
